# Carrier Command's promoted gates, for tools/gates.py (`uv run python tools/gates.py run carriercommand`).
# Needs scratchpad/carrier/c_s30.snap and c_mv.snap, the carrier_auto.st disk they remount, and the AI corpus
# under scratchpad/carrier/ai/ (all indexed in scratchpad/ANCHORS.md; how they were made: README "Snapshots").

[[gate]]
name = "render"
cmd = "bash gate_render.sh"
cwd = "py/render"
expect = ["4096 / 4096", "360 / 360", "120 / 120", "480 / 480", "780 / 780"]
cite = "render.md (proof table)"
minutes = 1

[[gate]]
name = "economy"
cmd = "bash gate_economy.sh"
cwd = "py/world"
expect = ["175/175", "14/14", "4/4", "1/1"]
cite = "economy.md (proof table)"
minutes = 3

[[gate]]
name = "target"
cmd = "{python} gate_score.py"
cwd = "py/ai"
expect = ["1344/1344", "21/21"]
cite = "ai.md section 2"
minutes = 1

[[gate]]
name = "units"
cmd = "bash gate_units.sh"
cwd = "py/units"
expect = ["150/150", "600/600", "529/529", "10/10", "12/12", "5/5", "re:takeoff at rest 42/42", "re:takeoff carrier turning 42/42", "re:takeoff controls 11/13", "re:flight launch 300/300", "re:flight ceiling 400/400", "re:flight low-hull 400/400", "re:flight controls 22/26", "re:fuel full hull 300/300", "re:fuel low hull 300/300", "re:landing rest 250/250", "re:landing carrier-turning 400/400", "re:landing far-low 500/500", "re:landing controls 23/32", "re:stow: hangar .* after 11 ticks, lift at rest after 21", "re:runway window 23/23", "re:taxi lined-up 399/399", "re:taxi skewed 449/449", "re:taxi controls 15/22", "re:runway takeoff 159/159", "re:runway takeoff controls 11/14", "re:walrus stowed@429", "re:walrus dock 428/428", "re:walrus carrier-turning 900/900", "re:walrus controls 20/31"]
cite = "vehicles.md (proof table)"
minutes = 9

[[gate]]
name = "difficulty"
cmd = "bash gate_difficulty.sh"
cwd = "py/ai2"
expect = ["3/3"]
cite = "ai.md section 6 (A/B/C)"
minutes = 3

[[gate]]
name = "hidden"
cmd = "bash gate_hidden.sh"
cwd = "py/curio"
expect = ["re:ctrl\\+V version: keys 1 control 0", "re:alt\\+help message: keys 1 control 0", "re:ctrl\\+S pause: keys 1 control 0", "re:ctrl\\+Q resume: keys 1 control 0", "re:keypad 6 colour card: keys 1 control 0", "re:keypad 6 without cheat: keys 0 control 0", "re:keypad 8 frame meter: keys 1 control 0", "re:keypad 7 main loops: keys 215 control 18", "re:keypad 7 view draws: keys 1 control 17", "re:andy handler: .* until after 72204 steps", "re:andy shipped: .* max_steps after 3000000 steps"]
cite = "README.md (Hidden keys and leftovers), ai.md section 7"
minutes = 2
