# Carrier Command's promoted gates, for tools/gates.py (`uv run python tools/gates.py run carriercommand`).
# Needs scratchpad/carrier/c_s30.snap and c_mv.snap, the carrier_auto.st disk they remount, and the AI corpus
# under scratchpad/carrier/ai/ (all indexed in scratchpad/ANCHORS.md; how they were made: README "Snapshots").

[[gate]]
name = "render"
cmd = "bash gate_render.sh"
cwd = "py/render"
expect = ["4096 / 4096", "360 / 360", "120 / 120", "480 / 480", "780 / 780"]
cite = "render.md (proof table)"
minutes = 1

[[gate]]
name = "economy"
cmd = "bash gate_economy.sh"
cwd = "py/world"
expect = ["175/175", "14/14", "4/4", "1/1"]
cite = "economy.md (proof table)"
minutes = 3

[[gate]]
name = "target"
cmd = "{python} gate_score.py"
cwd = "py/ai"
expect = ["1344/1344", "21/21"]
cite = "ai.md section 2"
minutes = 1

[[gate]]
name = "units"
cmd = "bash gate_units.sh"
cwd = "py/units"
expect = ["150/150", "600/600", "529/529", "10/10", "12/12", "5/5", "re:takeoff at rest 42/42", "re:takeoff carrier turning 42/42", "re:takeoff controls 11/13", "re:flight launch 300/300", "re:flight ceiling 400/400", "re:flight low-hull 400/400", "re:flight controls 22/26", "re:fuel full hull 300/300", "re:fuel low hull 300/300", "re:landing rest 250/250", "re:landing carrier-turning 400/400", "re:landing far-low 500/500", "re:landing controls 23/32", "re:stow: hangar .* after 11 ticks, lift at rest after 21", "re:runway window 23/23", "re:taxi lined-up 399/399", "re:taxi skewed 449/449", "re:taxi controls 15/22"]
cite = "vehicles.md (proof table)"
minutes = 9

[[gate]]
name = "difficulty"
cmd = "bash gate_difficulty.sh"
cwd = "py/ai2"
expect = ["3/3"]
cite = "ai.md section 6 (A/B/C)"
minutes = 3
