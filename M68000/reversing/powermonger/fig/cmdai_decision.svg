<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 956" width="900" height="956" role="img" aria-labelledby="t1 d1" xml:space="preserve">
<title id="t1">Commander AI decision: one group per pass of $6564</title>
<desc id="d1">Flow of the commander AI's group loop $6564 and decision chain $65b4 with the natural hit count of each arm.
Sources (reversing/powermonger/strategy.md): "The commander AI `$6522`" (the filters, the state switch, decide arms 1 to 5, "The pending word"),
"Natural coverage" (short census 95 / 2 / 77 / 179 / 137; 75-land census $65c8 3507, $65f4 2286, $6638 31122, $666c 145, $668c 5, $664c 6913, $66a4 0, $6884 0),
"The exact arm conditions" (predicate_check.py 5724/5724), "Food fallback `$66a4`" (food_boundary.py 15/15), "Transfer `$664c`, `$668c`",
"Refusal `$6884` cannot hold from any caller", "Proof of the commander AI" (gate_cmdai.py 323/323 natural, 280/280 synthetic).
Branch addresses checked against a disassembly of $6564..$66e6 (scratchpad/pm123/win/m1_map.ram). Full fact list: cmdai_decision.facts.md.</desc>
<style>
