<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" role="img" aria-labelledby="t2 d2" xml:space="preserve">
<title id="t2">The signed-clock stall of the camp wait</title>
<desc id="d2">The camp wait compares stamp + $14 with the sim clock word $2df72 as signed words, so a group camped before tick 32768 waits about 34,800 ticks once the clock passes 32768.
Sources (reversing/powermonger/strategy.md): "Where it runs" (the $13000 listing: $1302e addq.l #1,$2df70), "The commander AI `$6522`" bullet "The signed-clock stall" (mechanism, W5G_k80 / W5G_k108 chunks: 1500 and 1843 decisions per chunk, 168 / 93 in the crossing chunk, 0 after; clock 32599 / 32674; stamps 2088 / 2038),
"Isolation by clock pokes" (the five-row table, start L2G_k80_c8.snap, clock 11729, stamp 2088, stamp + 20 = 2108, about 167k steps per tick), "$51538 group-order table" (word 256 stamped by $3720).
Literal scans of scratchpad/pm123/win/m1_map.ram $0..$40000: $2df72 in the instructions at $3720 and $65a0 only; the long $2df70 at $12f6 and $1352 (copies to $2df74), $1302e (increment), $1373c (compare with $2df74), $13baa (clr.l). LOAD note: strategy.md "The loaded camp stamps against the kept clock" and the stall bullet "A LOAD is a second way into the stall" (py/saveload/camp_stamps.py). Full fact list: clock_stall.facts.md.</desc>
