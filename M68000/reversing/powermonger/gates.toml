# PowerMonger's promoted callcap gates, for tools/gates.py (`uv run python tools/gates.py run powermonger`).
# Each expected count is the one py/README.md (and the topic doc it cites) records for exactly this command line;
# gates whose doc count needs a corpus built by hand first (the PM_SERIES / PM_POP_CORPUS rolls) are not listed.
# `minutes` is the runtime measured by the first gates.py run (it only sets the timeout).

[[gate]]
name = "jobs"
cmd = "{python} reversing/powermonger/py/gate_jobs.py"
expect = ["3310/3310"]
cite = 'py/README.md gate_jobs.py; economy.md 5a'
minutes = 2

[[gate]]
name = "pop"
cmd = "{python} reversing/powermonger/py/gate_pop.py"
expect = ["29860/29860"]
cite = 'py/README.md gate_pop.py (default corpus pm139/corpus_2984)'
minutes = 1

