# Captain Blood's promoted gates, for tools/gates.py (`uv run python tools/gates.py run captainblood`).
# Counts: e45a 600, e6a2 300, e58a 250, e628 and e22e 200, the coin and roll threshold sets 100 each, total 1750.
# Needs scratchpad/captainblood/rules/snap/i1.snap (copy of scratchpad/captainblood/i1.snap with its .prov.json),
# scratchpad/captainblood/depacked/BLOOD.COM and the disk image the sidecar names (README "Running it").

[[gate]]
name = "rules"
cmd = "{python} gate.py"
cwd = "py/rules"
expect = ["600/600", "300/300", "250/250", "200/200", "100/100", "1750/1750"]
cite = "rules.md (proof)"
minutes = 1

# Needs scratchpad/captainblood/canyon_1.snap and q16_d.snap (with sidecars). Captures canyon/main_loop.snap fresh.
# The `ROUTE` line is printed from the two arms' own `hits` on $d8c8, so swapped arms print `esc d8c8=0` and fail.
[[gate]]
name = "canyon"
cmd = "{python} gate.py"
cwd = "py/canyon"
expect = ["re:model none : D0 match 52/52, branch match 52/52", "re:ROUTE esc d8c8=1 table=0xd5e4 control d8c8=0 table=0xd58a"]
cite = "README.md (Canyon flight)"
minutes = 1
