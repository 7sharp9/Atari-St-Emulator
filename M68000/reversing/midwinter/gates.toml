name = "army"
cmd = "{python} gate_army.py 1000"
cwd = "py/army"
expect = ["42/42", "10/10", "31008/31008", "9/9", "4864/4864", "1000/1000", "284/284"]
cite = "ai.md (opening proof list)"
minutes = 1

