# Midwinter's promoted gates, for tools/gates.py (`uv run python tools/gates.py run midwinter`).
# Needs scratchpad/midwinter/d_decisions.snap, d_options.snap, d_team.snap, d_stark.snap, d_ski.snap and zuul067.st (indexed in scratchpad/ANCHORS.md); the gates make their own snapshots, except sabotage, which reads the driven snapshots py/sabotage/drive_sabotage.sh writes to scratchpad/midwinter/sabotage/.

[[gate]]
name = "terrain"
cmd = "{python} gate_terrain.py"
cwd = "py/terrain"
expect = ["70000/70000", "10000/10000"]
cite = "terrain.md (opening proof paragraph)"
minutes = 1

